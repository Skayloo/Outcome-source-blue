<!doctype html>
<meta charset="utf-8">
<title>Проверка нормализатора громкости</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  button { font: inherit; padding: 8px 16px; }
  table { border-collapse: collapse; margin-top: 20px; width: 100%; }
  td, th { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
  .ok { color: #1c7a4a; font-weight: 600; }
  .bad { color: #b3261e; font-weight: 600; }
  code { background: #f2f2f4; padding: 2px 5px; border-radius: 4px; }
</style>

<h1>Нормализатор громкости</h1>
<p>Открыть в Chrome, Firefox и Safari. Проверяется то, что сломалось на живом созвоне:
поднимается ли AudioContext и вытягивает ли усиление тихий сигнал к цели в каждом браузере.
Микрофон не нужен — источник синтетический.</p>

<button id="run">Запустить</button>
<table id="out"><tr><th>Проверка</th><th>Итог</th></tr></table>

<script type="module">
// The same arithmetic the client ships. Kept in one place: scripts/makeup-gain-check.mjs reads
// the module in Node, this page exercises the wiring around it in a real browser.
const TARGET_RMS = 0.05, SPEECH_FLOOR_RMS = 0.004;
const MIN_MAKEUP = 1, MAX_MAKEUP = 12, RISE = 1.06, FALL = 0.85;
function nextMakeupGain(current, rms) {
  if (!Number.isFinite(rms) || rms < SPEECH_FLOOR_RMS) return current;
  const wanted = TARGET_RMS / rms;
  const stepped = wanted > current ? Math.min(current * RISE, wanted) : Math.max(current * FALL, wanted);
  return Math.min(MAX_MAKEUP, Math.max(MIN_MAKEUP, stepped));
}

const out = document.getElementById("out");
const row = (name, ok, detail) => {
  const tr = out.insertRow();
  tr.insertCell().textContent = name;
  const c = tr.insertCell();
  c.className = ok ? "ok" : "bad";
  c.textContent = (ok ? "ок" : "ПРОВАЛ") + (detail ? " — " + detail : "");
};

document.getElementById("run").onclick = async () => {
  out.querySelectorAll("tr:not(:first-child)").forEach((r) => r.remove());

  // 1. The context must actually run. This is the failure that made a guest silent: a
  //    suspended context runs no graph and its destination emits nothing at all.
  const ctx = new AudioContext({ sampleRate: 48000 });
  if (ctx.state !== "running") await ctx.resume().catch(() => {});
  row("AudioContext запущен", ctx.state === "running", ctx.state);

  // 2. A deliberately quiet source — a tenth of the target — has to be lifted to it.
  const osc = ctx.createOscillator();
  osc.frequency.value = 220;
  const quiet = ctx.createGain();
  quiet.gain.value = 0.007;                 // ≈ -43 dBFS, a bare laptop mic on Firefox
  const meter = ctx.createAnalyser();
  meter.fftSize = 1024;
  const makeup = ctx.createGain();
  makeup.gain.value = 2;
  const outMeter = ctx.createAnalyser();
  outMeter.fftSize = 1024;
  const sink = ctx.createMediaStreamDestination();

  osc.connect(quiet);
  quiet.connect(meter);
  quiet.connect(makeup);
  makeup.connect(outMeter);
  makeup.connect(sink);
  osc.start();

  const buf = new Float32Array(meter.fftSize);
  const rms = (node) => { node.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; return Math.sqrt(s / buf.length); };

  // A moment first: an oscillator that has just started has not filled the analyser yet, and
  // reading it on the same tick measures the silence before the first sample.
  await new Promise((r) => setTimeout(r, 300));
  row("Анализатор читает сигнал", rms(meter) > 0.001, rms(meter).toFixed(5));

  let gain = 2;
  const started = performance.now();
  await new Promise((done) => {
    const timer = setInterval(() => {
      const next = nextMakeupGain(gain, rms(meter));
      if (next !== gain) { gain = next; makeup.gain.setTargetAtTime(gain, ctx.currentTime, 0.15); }
      if (performance.now() - started > 6000) { clearInterval(timer); done(); }
    }, 120);
  });

  const settled = rms(outMeter);
  row("Тихий сигнал вытянут к цели", Math.abs(settled - TARGET_RMS) < TARGET_RMS * 0.3,
      `итог ${settled.toFixed(4)}, цель ${TARGET_RMS}, усиление ×${gain.toFixed(1)}`);
  row("Дорожка на отправку живая", sink.stream.getAudioTracks().length === 1);

  osc.stop();
  await ctx.close();
};
</script>
