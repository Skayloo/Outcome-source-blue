# Map for WebSocket upgrade (http context — conf.d is included inside http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the EDGE's X-Forwarded-Proto (Caddy says "https") instead of clobbering it with
# our own $scheme — this hop is plain HTTP, so $scheme would tell the backend "http" and
# break everything derived from it (minted absolute URLs, HSTS emission).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# What "/" serves. The app is a client-rendered SPA, so what it hands a crawler is an empty
# <div id="root"> — nothing to index, which is why the site did not appear in search. The
# public domain therefore answers "/" with a static landing page and keeps the app at /app.
#
# Keyed on $host, NOT on path, because a tenant's own subdomain (w3g.outcome.ru and friends)
# must keep serving the app at "/" — that is the only URL its members have.
#
# LANDING_HOST defaults to "-", which is not a legal hostname and so matches nothing: every
# self-hosted install keeps "/" as the app with no configuration and no change in behaviour.
map $host $root_doc {
    default                 /index.html;
    "${LANDING_HOST}"       /landing.html;
    "www.${LANDING_HOST}"   /landing.html;
}

server {
    listen 80;
    # Optional built-in HTTPS. Only used when you serve the frontend DIRECTLY (no edge
    # proxy) — e.g. a LAN IP — where the browser needs a SECURE CONTEXT for mic/camera/
    # screen share (getUserMedia/getDisplayMedia are blocked over plain-HTTP non-localhost
    # origins). The entrypoint writes a `listen 443 ssl` snippet here ONLY when TLS_SAN is
    # set; the glob include tolerates zero files, so with TLS_SAN unset this is HTTP-only.
    #
    # BEHIND Caddy / a Kubernetes Ingress you leave TLS_SAN unset: the EDGE terminates TLS
    # with a real cert and proxies to this frontend over plain HTTP on :80. Secure context
    # depends only on the origin the BROWSER loads (the edge's https URL), not on internal
    # hops — so getUserMedia works even though the cluster traffic is unencrypted.
    include /etc/nginx/tls/*.conf;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Modern TLS only (applies when the built-in HTTPS listener is active, i.e. TLS_SAN set).
    # Behind an edge proxy (Caddy/Ingress) these are inert — the edge terminates TLS.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Resolve the backend via DNS at REQUEST time (valid=5s) instead of caching one IP
    # at startup — this load-balances across `server` replicas and survives replica
    # restarts. proxy_pass with a variable forces the per-request resolution.
    # ${DNS_RESOLVER}/${BACKEND_UPSTREAM} are env-substituted at container start
    # (Docker: 127.0.0.11 / server:5000; Kubernetes: cluster DNS IP / server Service).
    resolver ${DNS_RESOLVER} valid=5s ipv6=off;
    set $backend_upstream http://${BACKEND_UPSTREAM};

    # No security headers at this level on purpose. Everything proxied to the backend gets them
    # from the app's own middleware, which sets them on every response and travels with the API
    # wherever it is deployed. Adding them here too produced each one twice, and a duplicated
    # X-Frame-Options is one some browsers drop entirely.
    #
    # What nginx serves ITSELF — the SPA document and the static locations below — has no
    # backend to set them, so those locations carry their own copies.

    # Allow large file uploads (avatars, attachments) to reach the backend.
    client_max_body_size 100M;

    # Compress text assets (the app bundle is ~930KB raw → ~250KB gzipped).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # File uploads (avatars, attachments, bug screenshots) -> backend, capped at 100 MB at the
    # edge so an oversized body is rejected (413) before it ever reaches the backend. More
    # specific than /api/ so nginx routes uploads here (longest-prefix match).
    location /api/v1/uploads {
        client_max_body_size 100M;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
    }

    # REST + WebSocket -> backend (same-origin for the browser, no CORS).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # LiveKit signaling proxy -> backend.
    location /livekit/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Uploaded files -> backend.
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # OpenAPI spec + Scalar API reference UI -> backend (browse the docs at <origin>/scalar).
    location /openapi {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }
    location /scalar {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Hashed build assets: immutable, cache for a year (filename changes on rebuild).
    # The noise-suppression model and its wasm: 12 MB over the wire, and they never change —
    # the path carries the model version (v3), so a new model is a new URL. Without this they
    # land in the catch-all below and every call start re-validates 24 MB worth of files.
    location /dfn/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }

    # Desktop builds, mounted from the host rather than baked into this image — see the
    # frontend service in docker-compose.home.yml for why. Its own location for one reason
    # above all: the SPA fallback at the bottom answers a MISSING file with index.html and a
    # 200, so one typo in a download URL hands the visitor an HTML page saved under a .exe
    # name — an installer that "downloads fine" and then will not run, with nothing anywhere
    # to explain it. 404 instead.
    location /download/ {
        # The filenames carry their version, so the bytes behind a given URL never change.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # No installer extension is in nginx's mime.types, so without this they would be served
        # as text/plain and some browsers would render the binary instead of saving it.
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    # The front door, and ONLY the front door — an exact match, so every other path still falls
    # through to the SPA below. An internal rewrite rather than its own try_files: it hands the
    # chosen document straight back to `location /`, which means the landing is served with the
    # same security headers as every other document here instead of a second copy of them that
    # would quietly drift out of sync.
    #
    # On a tenant subdomain $root_doc is /index.html, so this resolves to exactly what "/"
    # served before and nothing changes for them.
    location = / {
        rewrite ^ $root_doc last;
    }

    # SPA fallback. index.html must revalidate so deploys are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        # Security headers for the app document. CSP is scoped to what the SPA actually needs:
        # same-origin code/styles/fonts/images, blob/data media, and WS to same-origin + LiveKit.
        # img/media/connect allow https: — the SPA can sign into a FOREIGN self-hosted
        # instance (the login screen's server field), so avatars/attachments/REST/WS may
        # target another origin. Scripts/styles/fonts stay strictly same-origin.
        # Two additions here, both for the noise-suppression models, both narrower than they
        # look:
        #   'wasm-unsafe-eval' — Chrome refuses to compile WebAssembly under a bare
        #     script-src 'self'. It permits WASM compilation ONLY and does not enable eval()
        #     for JavaScript, so do not "simplify" it to 'unsafe-eval'.
        #   blob: — the DeepFilterNet package builds its AudioWorklet from a blob URL, and
        #     worklets are checked against script-src, not worker-src (where blob: already
        #     was). This allows scripts from blobs THIS page created; it does not open the
        #     door to any external origin.
        # Without them Chrome silently left every guest with no filter at all while Firefox
        # and Safari ran fine and hid it.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self'; connect-src 'self' https: ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        try_files $uri /index.html;
    }
}
