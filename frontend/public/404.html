<!doctype html>
<!--
  nginx's 404 (frontend/nginx.conf, error_page). Self-contained — inline styles, no landing.css — so it
  also works in a build without the landing, and on any host. Both languages on one page: a missing
  address has no language of its own.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена · Page not found</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
@font-face{font-family:"Onest";font-weight:400 800;font-display:swap;src:url("/fonts/onest-cyrillic.woff2") format("woff2");unicode-range:U+0400-045F;}
@font-face{font-family:"Onest";font-weight:400 800;font-display:swap;src:url("/fonts/onest-latin.woff2") format("woff2");unicode-range:U+0000-00FF;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:2rem 1rem;background:#0d0e10;color:#e6edf2;
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
  background-image:radial-gradient(50% 45% at 50% 30%,rgba(0,200,255,.24),transparent 70%)}
.code{font-size:clamp(4rem,3rem + 8vw,8rem);font-weight:800;letter-spacing:-.05em;line-height:1;color:#5cdcff}
h1{margin:1rem 0 .4rem;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
p{margin:0;color:#9aa7b2}
.links{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:2rem}
a{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;font-weight:600;text-decoration:none;color:#04121a;background:#00c8ff}
a.ghost{background:transparent;color:#e6edf2;border:1px solid rgba(0,200,255,.45)}
a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p lang="en">Page not found</p>
  <div class="links">
    <a href="/">На главную</a>
    <a class="ghost" href="/en" lang="en">Home (EN)</a>
  </div>
</main>
</body>
</html>
