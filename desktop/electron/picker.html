<!doctype html>
<!--
  The screen-share source picker.

  Electron denies getDisplayMedia unless the main process answers it, and the answer has to
  name a source — there is no built-in chooser to fall back on. Until this existed the handler
  grabbed sources[0], which meant "share your whole first monitor" whatever the user actually
  wanted, and no way to share sound at all.

  Its own window rather than something drawn inside the app: the list contains thumbnails of
  every window on the machine, including ones from other applications, and that is not content
  to hand to the renderer that also runs the messenger.
-->
<meta charset="utf-8">
<title>Outcome</title>
<style>
  :root{
    --bg:#141118; --surface:#1e1928; --surface-hi:#272132;
    --line:rgba(232,228,240,.12); --text:#e8e4f0; --dim:#a49db4;
    --iris:#8b5cf6; --iris-hi:#a78bfa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 "Segoe UI",system-ui,sans-serif;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }
  header{padding:16px 18px 0;}
  h1{margin:0;font-size:16px;font-weight:600;}
  .tabs{display:flex;gap:4px;margin-top:14px;}
  .tab{
    background:none;border:none;color:var(--dim);font:inherit;font-weight:500;
    padding:7px 14px;border-radius:8px;cursor:pointer;
  }
  .tab:hover{color:var(--text);}
  .tab[aria-selected="true"]{background:var(--surface-hi);color:var(--text);}

  main{flex:1;overflow-y:auto;padding:14px 18px;}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
  .item{
    background:var(--surface);border:2px solid transparent;border-radius:10px;
    padding:8px;cursor:pointer;text-align:left;color:inherit;font:inherit;
    display:flex;flex-direction:column;gap:8px;
    /* A grid child defaults to min-width:auto, so it refuses to shrink below its content and
       a long window title pushes the whole grid sideways instead of ellipsing. */
    min-width:0;
  }
  .item:hover{background:var(--surface-hi);}
  .item[aria-pressed="true"]{border-color:var(--iris);background:var(--surface-hi);}
  .item .shot{width:100%;aspect-ratio:16/10;object-fit:contain;background:#0d0b12;border-radius:6px;display:block;}
  .item .name{
    font-size:12.5px;color:var(--dim);
    display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;
  }
  .item[aria-pressed="true"] .name{color:var(--text);}
  .item .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;}
  .item .name img{width:16px;height:16px;aspect-ratio:auto;background:none;border-radius:0;flex:0 0 auto;}
  .empty{color:var(--dim);padding:28px 0;text-align:center;}

  footer{
    padding:12px 18px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:14px;
  }
  .audio{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer;user-select:none;}
  .audio input{accent-color:var(--iris);width:16px;height:16px;cursor:pointer;}
  .audio.off{opacity:.45;cursor:default;}
  .spacer{margin-left:auto;}
  button.act{
    font:inherit;font-weight:600;padding:8px 18px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--text);
  }
  button.act.primary{background:var(--iris);border-color:var(--iris);color:#fff;}
  button.act.primary:hover:not(:disabled){background:var(--iris-hi);}
  button.act:disabled{opacity:.4;cursor:default;}
</style>

<header>
  <h1>Выберите, чем поделиться</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-kind="screen" aria-selected="true">Экран</button>
    <button class="tab" role="tab" data-kind="window" aria-selected="false">Окно</button>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>

<footer>
  <label class="audio" id="audioWrap">
    <input type="checkbox" id="audio">
    <span id="audioLabel">Передавать звук</span>
  </label>
  <span class="spacer"></span>
  <button class="act" id="cancel">Отмена</button>
  <button class="act primary" id="share" disabled>Поделиться</button>
</footer>

<script>
  const grid = document.getElementById('grid');
  const shareBtn = document.getElementById('share');
  const audioBox = document.getElementById('audio');
  const audioWrap = document.getElementById('audioWrap');
  const audioLabel = document.getElementById('audioLabel');

  let sources = [];
  let kind = 'screen';
  let picked = null;

  // Two reasons the checkbox can be unavailable, and each of them says which. Loopback
  // capture exists only on Windows, and it takes the whole device output — so there is no
  // such thing as the sound of one window. A control greyed out with no explanation reads
  // as a bug; these are platform limits.
  function syncAudio() {
    const canAudio = window.picker.audioSupported && kind === 'screen';
    audioBox.disabled = !canAudio;
    audioWrap.classList.toggle('off', !canAudio);
    audioLabel.textContent = !window.picker.audioSupported
      ? 'Передача звука доступна только в Windows'
      : kind === 'screen'
        ? 'Передавать звук'
        : 'Звук передаётся только при показе экрана целиком';
    if (!canAudio) audioBox.checked = false;
  }

  function render() {
    const list = sources.filter((s) => s.kind === kind);
    grid.innerHTML = '';
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = kind === 'window' ? 'Открытых окон не найдено' : 'Экранов не найдено';
      grid.appendChild(p);
      return;
    }
    for (const s of list) {
      const b = document.createElement('button');
      b.className = 'item';
      b.setAttribute('aria-pressed', String(picked === s.id));
      b.onclick = () => { picked = s.id; shareBtn.disabled = false; render(); };

      // A minimised window has no thumbnail. An <img> with an empty source would draw the
      // broken-image glyph there, which looks like the picker itself failed.
      const shot = document.createElement(s.thumbnail ? 'img' : 'div');
      if (s.thumbnail) { shot.src = s.thumbnail; shot.alt = ''; }
      shot.className = 'shot';
      b.appendChild(shot);

      const name = document.createElement('div');
      name.className = 'name';
      if (s.icon) {
        const ic = document.createElement('img');
        ic.src = s.icon; ic.alt = '';
        name.appendChild(ic);
      }
      const label = document.createElement('span');
      label.textContent = s.name;
      label.title = s.name;
      name.appendChild(label);
      b.appendChild(name);

      grid.appendChild(b);
    }
  }

  for (const tab of document.querySelectorAll('.tab')) {
    tab.onclick = () => {
      kind = tab.dataset.kind;
      for (const t of document.querySelectorAll('.tab')) {
        t.setAttribute('aria-selected', String(t === tab));
      }
      picked = null;
      shareBtn.disabled = true;
      syncAudio();
      render();
    };
  }

  document.getElementById('cancel').onclick = () => window.picker.cancel();
  shareBtn.onclick = () => { if (picked) window.picker.choose(picked, audioBox.checked); };
  // Escape is what people press on a modal they opened by accident.
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.cancel(); });

  window.picker.sources().then((list) => {
    sources = list;
    syncAudio();
    render();
  });
</script>
