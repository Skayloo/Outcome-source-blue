# MinIO object storage for uploads (avatars/attachments). Swap for S3/any
# S3-compatible service by pointing OUTCOME_Minio__* at it instead.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: outcome
spec:
  selector: { app: minio }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: outcome
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          ports: [{ containerPort: 9000 }]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: outcome-secrets, key: minio-access-key } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: outcome-secrets, key: minio-secret-key } }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
