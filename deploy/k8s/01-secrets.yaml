# Placeholders, and deliberately non-working: this file is published, so any value that
# functioned here would be a known signing key on every install that skipped this step.
# Generate each one (openssl rand -hex 32, and base64 of 32 bytes for the storage key).
# Migrating from compose: copy the values out of your own .env, not from here.
apiVersion: v1
kind: Secret
metadata:
  name: outcome-secrets
  namespace: outcome
type: Opaque
stringData:
  jwt-key: "CHANGE_ME_openssl_rand_hex_32"
  livekit-api-key: "CHANGE_ME_livekit_key"
  livekit-api-secret: "CHANGE_ME_livekit_secret_min_32_chars"
  minio-access-key: "CHANGE_ME_minio_access"
  minio-secret-key: "CHANGE_ME_minio_secret"
  postgres-password: "CHANGE_ME_postgres"
