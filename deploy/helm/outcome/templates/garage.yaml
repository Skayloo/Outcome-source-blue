{{- if .Values.garage.enabled }}
# File storage: Garage (S3), one node. It sets itself up — --single-node lays the cluster out,
# --default-bucket makes the access key and the bucket from the environment. The image has no
# shell; everything it needs comes from the env and the config below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "outcome.fullname" . }}-garage
  labels: {{- include "outcome.labels" . | nindent 4 }}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "outcome.fullname" . }}-garage
  labels: {{- include "outcome.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: garage }
  ports: [{ name: s3, port: 3900, targetPort: 3900 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "outcome.fullname" . }}-garage
  labels: {{- include "outcome.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "outcome.fullname" . }}-garage
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: garage }
  template:
    metadata:
      labels:
        {{- include "outcome.labels" . | nindent 8 }}
        app.kubernetes.io/component: garage
      annotations:
        checksum/config: {{ .Values.garage | toJson | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: garage
          image: {{ .Values.garage.image }}
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          ports: [{ containerPort: 3900 }]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "outcome.secretName" . }}, key: garage-rpc-secret } }
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "outcome.secretName" . }}, key: storage-access-key } }
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "outcome.secretName" . }}, key: storage-secret-key } }
            - { name: GARAGE_DEFAULT_BUCKET, value: {{ .Values.config.minioBucket | quote }} }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml }
            - { name: data, mountPath: /var/lib/garage/meta, subPath: meta }
            - { name: data, mountPath: /var/lib/garage/data, subPath: data }
          readinessProbe:
            exec: { command: ["/garage", "status"] }
            periodSeconds: 10
          resources: {{- toYaml .Values.garage.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ include "outcome.fullname" . }}-garage }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.garage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.garage.storage }} } }
{{- end }}
