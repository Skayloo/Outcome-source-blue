{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outcome.fullname" . }}-secrets
  labels: {{- include "outcome.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-key: {{ required "secrets.jwtKey is required (openssl rand -hex 32) — or set secrets.existingSecret" .Values.secrets.jwtKey | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  storage-access-key: {{ required "secrets.storageAccessKey is required" .Values.secrets.storageAccessKey | quote }}
  storage-secret-key: {{ required "secrets.storageSecretKey is required" .Values.secrets.storageSecretKey | quote }}
  {{- if .Values.garage.enabled }}
  garage-rpc-secret: {{ required "secrets.garageRpcSecret is required for the bundled Garage (openssl rand -hex 32)" .Values.secrets.garageRpcSecret | quote }}
  {{- end }}
  livekit-api-key: {{ required "secrets.livekitApiKey is required" .Values.secrets.livekitApiKey | quote }}
  livekit-api-secret: {{ required "secrets.livekitApiSecret is required" .Values.secrets.livekitApiSecret | quote }}
{{- end }}
