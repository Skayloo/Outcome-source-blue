# ── Outcome — Docker Swarm stack ──────────────────────────────────────────────
# Deploy:  docker stack deploy -c docker-stack.yml outcome
# (see README.md for creating the secrets + labelling the LiveKit node first).
#
# Secrets are real Swarm secrets (files under /run/secrets). Postgres reads them natively via
# *_FILE, Garage its RPC secret via GARAGE_RPC_SECRET_FILE; LiveKit via key_file; the .NET API via
# a tiny sh shim that exports them before exec. Garage's access key is the one exception: its
# image has no shell to read a file with, so GARAGE_ACCESS_KEY / GARAGE_SECRET_KEY come from the
# environment `docker stack deploy` runs in (README). Rolling updates are start-first with
# automatic rollback.
version: "3.9"

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-restart: &restart
  restart_policy: { condition: any, delay: 5s }

services:
  caddy:
    image: caddy:2-alpine
    <<: *logging
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 443
        published: 443
        mode: ingress
      - target: 443
        published: 443
        protocol: udp
        mode: ingress
    environment:
      OUTCOME_DOMAIN: ${OUTCOME_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [outcome]
    deploy:
      replicas: 1
      <<: *restart
      update_config: { order: start-first }

  frontend:
    image: ${FRONTEND_IMAGE}
    <<: *logging
    environment:
      TLS_SAN: ""   # behind Caddy — plain HTTP, edge terminates TLS
    networks: [outcome]
    deploy:
      replicas: 2
      <<: *restart
      update_config: { parallelism: 1, order: start-first }
      resources:
        limits: { cpus: "0.5", memory: 128M }

  server:
    image: ${SERVER_IMAGE}
    <<: *logging
    # Turn the mounted secret files into the env vars the app reads, then exec it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export OUTCOME_JwtAuth__JwtKey="$$(cat /run/secrets/jwt_key)"
        export OUTCOME_Voice__LiveKitApiKey="$$(cat /run/secrets/livekit_api_key)"
        export OUTCOME_Voice__LiveKitApiSecret="$$(cat /run/secrets/livekit_api_secret)"
        export ConnectionStrings__Postgres="Host=postgres;Port=5432;Database=outcome;Username=outcome;Password=$$(cat /run/secrets/postgres_password)"
        exec dotnet Outcome.Api.dll
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      OUTCOME_Redis__Url: "redis:6379"
      OUTCOME_Server__Name: "${SERVER_NAME:-Outcome}"
      OUTCOME_Minio__Endpoint: "garage:3900"
      OUTCOME_Minio__AccessKey: "${GARAGE_ACCESS_KEY:?export GARAGE_ACCESS_KEY (README)}"
      OUTCOME_Minio__SecretKey: "${GARAGE_SECRET_KEY:?export GARAGE_SECRET_KEY (README)}"
      OUTCOME_Minio__Bucket: "${MINIO_BUCKET:-outcome-uploads}"
      OUTCOME_Minio__UseSsl: "false"
      OUTCOME_Voice__LiveKitUrl: "wss://${OUTCOME_DOMAIN}/livekit"
      OUTCOME_Voice__LiveKitInternalUrl: "ws://livekit:7880"
      OUTCOME_Server__PublicOrigin: "https://${OUTCOME_DOMAIN}"
    secrets:
      - jwt_key
      - livekit_api_key
      - livekit_api_secret
      - postgres_password
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [outcome]
    deploy:
      replicas: ${SERVER_REPLICAS:-3}
      <<: *restart
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      rollback_config: { parallelism: 1 }
      resources:
        limits: { cpus: "1.0", memory: 512M }

  postgres:
    image: postgres:16
    <<: *logging
    environment:
      POSTGRES_DB: outcome
      POSTGRES_USER: outcome
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcome -d outcome"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [outcome]
    deploy:
      replicas: 1
      <<: *restart
      # Pin to a node with durable storage (label it: docker node update --label-add pgdata=true <node>).
      placement: { constraints: ["node.labels.pgdata == true"] }
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    <<: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [outcome]
    deploy:
      replicas: 1
      <<: *restart

  # File storage: Garage (S3), one node — MinIO until 1.31.79, which no longer publishes images.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    <<: *logging
    environment:
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_ACCESS_KEY:?export GARAGE_ACCESS_KEY (README)}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_SECRET_KEY:?export GARAGE_SECRET_KEY (README)}"
      GARAGE_DEFAULT_BUCKET: "${MINIO_BUCKET:-outcome-uploads}"
    secrets:
      # Garage refuses a secret file others can read.
      - { source: garage_rpc_secret, mode: 0400 }
    configs:
      - { source: garage_toml, target: /etc/garage.toml }
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [outcome]
    deploy:
      replicas: 1
      <<: *restart
      # Pin to a node with durable storage (label it: docker node update --label-add storage=true <node>).
      placement: { constraints: ["node.labels.storage == true"] }
      resources:
        limits: { cpus: "1.0", memory: 512M }

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP}"]
    <<: *logging
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml
    secrets: [livekit_keys]
    ports:
      # Media MUST reach the node whose public IP is LIVEKIT_NODE_IP. Pin livekit there
      # (label: docker node update --label-add livekit=true <node>). TCP/ICE on host mode
      # (no SNAT); the muxed UDP port published normally (fine with a single, pinned replica).
      # For heavy multi-node voice, run LiveKit standalone on the media host — see README.
      - { target: 7881, published: 7881, protocol: tcp, mode: host }
      - "7882:7882/udp"
    networks: [outcome]
    deploy:
      replicas: 1
      <<: *restart
      placement: { constraints: ["node.labels.livekit == true"] }
      resources:
        limits: { cpus: "1.0", memory: 512M }

configs:
  garage_toml:
    file: ../compose/garage/garage.toml
  caddyfile:
    file: ../compose/Caddyfile
  livekit_config:
    file: ./livekit.yaml

secrets:
  jwt_key:            { external: true }
  postgres_password:  { external: true }
  garage_rpc_secret:  { external: true }
  livekit_api_key:    { external: true }
  livekit_api_secret: { external: true }
  livekit_keys:       { external: true }

volumes:
  pgdata:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:

networks:
  outcome:
    driver: overlay
    attachable: true
