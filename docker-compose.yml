name: outcome

# Separated services: React frontend (nginx) + .NET backend + Postgres + LiveKit.
# The browser hits the frontend (8080); nginx reverse-proxies /api and /livekit
# to the backend so everything is same-origin (no CORS).

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:
  redis:
    <<: *logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    <<: *logging
    image: postgres:16
    environment:
      POSTGRES_DB: outcome
      POSTGRES_USER: outcome
      POSTGRES_PASSWORD: outcome
    volumes:
      - outcome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcome -d outcome"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    <<: *logging
    build:
      context: ./ServerDotnet
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=outcome;Username=outcome;Password=outcome"
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      # Local dev stack → Development so the /scalar API docs are exposed. The deploy/ prod
      # configs leave this unset (defaults to Production), where OpenAPI/Scalar are disabled.
      ASPNETCORE_ENVIRONMENT: "Development"
      OUTCOME_Server__Name: "Outcome Server"
      # JWT signing key — REGENERATE PER DEPLOYMENT (HS256 needs >= 32 bytes).
      OUTCOME_JwtAuth__JwtKey: "ae95a466fe9ea37bac64a27f34e7663377b5b275a8efc37a21c97b1b5b219c4b"
      # Email/SMTP for 2FA codes. Leave Host blank to LOG the code instead of sending it.
      # Fill these to actually deliver email, then enable the "email_2fa" server setting.
      OUTCOME_Email__Host: ""
      OUTCOME_Email__Port: "587"
      OUTCOME_Email__Username: ""
      OUTCOME_Email__Password: ""
      OUTCOME_Email__From: "no-reply@outcome.local"
      OUTCOME_Email__UseSsl: "true"
      # MinIO/S3 object storage for uploaded files (regenerate credentials per deployment).
      OUTCOME_Minio__Endpoint: "minio:9000"
      OUTCOME_Minio__AccessKey: "outcome-b813931e"
      OUTCOME_Minio__SecretKey: "9f1bee7eb3c02fd7be15593362d3aeb8"
      OUTCOME_Minio__Bucket: "outcome-uploads"
      OUTCOME_Minio__UseSsl: "false"
      # AES-256-GCM at-rest encryption for uploaded files (base64 of 32 bytes).
      # REGENERATE PER DEPLOYMENT: openssl rand -base64 32
      OUTCOME_Minio__EncryptionKey: "BsNyggW4BuhqtmGhfhAKskRD8b3Kd+HqsdGCoBCaXwc="
      OUTCOME_Voice__LiveKitApiKey: "LK349f99acd290"
      OUTCOME_Voice__LiveKitApiSecret: "c4e6b63ef38d978da6d021507f1a06b72ba495fdd08c1a79"
      OUTCOME_Voice__LiveKitUrl: "ws://localhost:7880"
      OUTCOME_Voice__LiveKitInternalUrl: "ws://livekit:7880"
      # Redis backplane: makes N api replicas behave as one (WS fan-out, reconnect
      # replay, 2FA challenges, admin log tickets). Scale with docker-compose.scale.yml.
      OUTCOME_Redis__Url: "redis:6379"
    ports:
      - "5000:5000"   # exposed for direct REST/debugging; the browser uses the frontend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - outcome_data:/app/data

  frontend:
    <<: *logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # DIRECT-ACCESS HTTPS (no edge proxy): hosts/IPs the self-signed cert should cover.
      # Add your LAN IP so devices on the network get a SECURE CONTEXT (required for mic/
      # camera/screen share) — reach it via https://<LAN-IP>:8443 (accept the cert once).
      # BEHIND Caddy or a k8s Ingress: leave this EMPTY ("") — the edge terminates TLS with
      # a real cert and this frontend stays plain HTTP on :80 (drop the 8443 mapping too).
      TLS_SAN: "localhost,127.0.0.1,192.168.1.169"
    ports:
      - "8080:80"     # HTTP — fine for localhost / behind an edge proxy
      - "8443:443"    # direct-access HTTPS (self-signed) for mic/camera/screen share on a LAN
    depends_on:
      - server
    restart: unless-stopped

  minio:
    <<: *logging
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: outcome-b813931e
      MINIO_ROOT_PASSWORD: 9f1bee7eb3c02fd7be15593362d3aeb8
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - outcome_minio:/data
    restart: unless-stopped

  livekit:
    <<: *logging
    image: livekit/livekit-server:latest
    # Advertise the host's reachable IP as the media (ICE) candidate. On a LAN this must
    # be the host's LAN IP so both localhost AND other devices can reach the media ports;
    # on a VPS set LIVEKIT_NODE_IP to the public IP. Overrides livekit.yaml's use_external_ip.
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-192.168.1.169}"]
    volumes:
      - ./voice/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "55000-55100:55000-55100/udp"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  outcome_pgdata:
  outcome_data:
  outcome_minio:
